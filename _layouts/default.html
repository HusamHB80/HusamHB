<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="progress"><span id="progressBar"></span></div>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">HUSAM HABBOUB</a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}#work">WORK</a>
      <a href="{{ '/' | relative_url }}#about">ABOUT</a>
      <a href="{{ '/' | relative_url }}#contact">CONTACT</a>
    </nav>
    <button id="soundToggle" class="sound-toggle" type="button" aria-pressed="false">SOUND <span>OFF</span></button>
  </header>
  {{ content }}
  <footer class="site-footer shell">
    <span>HUSAM HABBOUB</span>
    <span>VIDEO EDITOR / MOTION DESIGNER</span>
    <span>© {{ site.time | date: '%Y' }}</span>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
